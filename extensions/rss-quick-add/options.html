<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkstone RSS Quick Add Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Inkstone address</h1>
    <label for="base-url">The address where you open Inkstone.</label>
    <input id="base-url" type="url" placeholder="https://notes.example.com" autocomplete="url">
    <p id="status" role="status"></p>
    <button id="save" type="button">Save</button>
  </main>
  <script src="options.js"></script>
</body>
</html>
