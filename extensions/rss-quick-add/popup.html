<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkstone RSS Quick Add</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Add page to Inkstone RSS</h1>
    <p id="page-url" class="url">Loading the current page…</p>
    <p id="status" role="status"></p>
    <button id="add" type="button" disabled>Open in Inkstone</button>
    <button id="options" type="button" class="secondary">Settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
