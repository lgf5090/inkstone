<!doctype html>
<html lang="en-US" data-theme="light" data-accent="cinnabar" data-background="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, self-hosted Markdown notebook built on Cloudflare." />
    <meta name="theme-color" content="#181614" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inkstone" />
    <title>Inkstone</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='8' fill='%231C1917'/%3E%3Cpath d='M16 8.5c2.6 3.4 5.2 6.1 5.2 9a5.2 5.2 0 1 1-10.4 0c0-2.9 2.6-5.6 5.2-9z' fill='%23E06A4F'/%3E%3C/svg%3E"
    />


    <script src="/boot.js"></script>

    <style>

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: light-dark(#faf9f7, #1a1817);
        z-index: 9999;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme='light'] #boot { background: #faf9f7; }
      html[data-theme='light'][data-background='white'] #boot { background: #fff; }
      html[data-theme='dark'] #boot { background: #1a1817; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot svg { width: 34px; height: 34px; animation: bootPulse 1.5s ease-in-out infinite; }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.28; transform: scale(0.97); }
        50% { opacity: 0.85; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; opacity: 0.6; }
      }
      /* Shown in place of the pulsing mark when the build this document names is gone: the app
         stylesheet may be one of the missing files, so this block carries its own colours. */
      .boot-failure {
        display: grid;
        justify-items: center;
        gap: 0.5rem;
        max-width: 20rem;
        padding: 0 1.5rem;
        text-align: center;
      }
      .boot-failure-title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 600;
        color: #1a1817;
      }
      .boot-failure-detail {
        margin: 0;
        font-size: 0.8125rem;
        line-height: 1.6;
        color: #5b5550;
      }
      .boot-failure-action {
        margin-top: 0.25rem;
        padding: 0.375rem 0.875rem;
        border: 0;
        border-radius: 0.5rem;
        background: #b5482e;
        color: #fff;
        font: inherit;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .boot-failure-action:focus-visible {
        outline: 2px solid #b5482e;
        outline-offset: 2px;
      }
      html[data-theme='dark'] .boot-failure-title { color: #f3eee8; }
      html[data-theme='dark'] .boot-failure-detail { color: rgba(243, 238, 232, 0.68); }
      html[data-theme='dark'] .boot-failure-action { background: #e06a4f; color: #1a1817; }
      html[data-theme='dark'] .boot-failure-action:focus-visible { outline-color: #e06a4f; }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="4.2" y="4.2" width="23.6" height="23.6" rx="7.4" stroke="#b5482e" stroke-width="2.2" />
        <path d="M16 9.4c2.3 3 4.6 5.4 4.6 8a4.6 4.6 0 1 1-9.2 0c0-2.6 2.3-5 4.6-8z" fill="#b5482e" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
