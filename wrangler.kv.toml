name = "inkstone-kv"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
preview_urls = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/c",
  "/c/*",
  "/feeds/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
  "/n/*",
  "/notes",
  "/memos",
  "/memos/*",
  "/calendar",
  "/todo",
  "/email",
  "/email/*",
  "/projects",
  "/nav",
  "/chat",
  "/subscriptions",
  "/reading",
  "/reading/*",
  "/rss",
  "/hooks/*",
  "/music",
  "/tools",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"

[[kv_namespaces]]
binding = "FILES_KV"

[[kv_namespaces]]
binding = "OAUTH_KV"

[[send_email]]
name = "EMAIL"
remote = true

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[[durable_objects.bindings]]
name = "EMAIL_MAILBOX"
class_name = "EmailMailbox"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[exports.EmailMailbox]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["* * * * *"]

[vars]
APP_NAME = "Inkstone"

[observability]
enabled = true
